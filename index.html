<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logos/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html:not(.light):not(.dark) {
        background: #111;
      }

      .scolup-startup {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        background: #111;
        color: #fff;
        font: 1rem / 1.5 system-ui, sans-serif;
        text-align: center;
      }

      .scolup-startup img {
        display: block;
        filter: brightness(0) invert(1);
      }

      .scolup-startup[data-ready] {
        pointer-events: none;
        animation: scolup-startup-fade 400ms ease-out forwards;
      }

      @keyframes scolup-startup-fade {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scolup-startup[data-ready] {
          display: none;
        }
      }
    </style>
    <script data-cfasync="false">
      (() => {
        function redirectIfNotStarted() {
          const root = document.getElementById("root")
          if (!root || !root.firstElementChild) {
            window.location.replace("https://app.scolup.com/")
          }
        }

        function handleStartupError(event) {
          const target = event.target
          const moduleFailed =
            target instanceof HTMLScriptElement && target.type === "module"
          const moduleThrew =
            event instanceof ErrorEvent &&
            event.filename &&
            Array.from(
              document.querySelectorAll('script[type="module"][src]')
            ).some((script) => script.src === event.filename)

          if (moduleFailed || moduleThrew) redirectIfNotStarted()
        }

        window.addEventListener("error", handleStartupError, true)
        window.setTimeout(() => {
          window.removeEventListener("error", handleStartupError, true)
          redirectIfNotStarted()
        }, 15000)
      })()
    </script>
    <noscript>

    </noscript>
