            "logo": "https://scolup.com/logos/logo.svg",

          {
            "@type": "WebSite",
            "@id": "https://scolup.com/#website",

    <style>
      .scolup-startup {

        min-height: 100vh;
        place-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        background: #111;
        color: #fff;
        font:
          1rem / 1.5 system-ui,
          sans-serif;
        text-align: center;
      }

      .scolup-startup h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .scolup-startup a {
        color: inherit;
        text-decoration: underline;
      }

      #root:not(:empty) + .scolup-startup {
        display: none;
      }
